name: Deploy the Field Kit to GitHub Pages

on:
  push:
    branches: [claude/they-were-here-dnd-wmaawr, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish ONLY the app. The campaign/ folder (GM secrets, spoilers)
      # deliberately stays out of the public site.
      - name: Assemble site
        run: |
          mkdir dist
          cp index.html styles.css sw.js manifest.webmanifest icon-192.png icon-512.png dist/
          cp -r js dist/js
          if [ -d art ]; then cp -r art dist/art; fi
          touch dist/.nojekyll

      # Pushing a gh-pages branch auto-enables GitHub Pages for the repo.
      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
